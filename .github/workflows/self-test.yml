name: self-test

# Checks every change to the pipeline itself before it can reach main.
# Required by the protect-main ruleset (Runbook, Section 2).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ZIZMOR_VERSION: "1.31.1"

jobs:
  self-test:
    name: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Python tests
        run: |
          pip install --quiet pytest pyyaml
          python -m pytest -q tests

      - name: Workflow syntax (actionlint)
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "${ACTIONLINT_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" actionlint
          ./actionlint -color .github/workflows/*.yml starter/.github/workflows/checks.yml

      - name: Workflow security (zizmor)
        run: |
          pip install --quiet "zizmor==${ZIZMOR_VERSION}"
          zizmor --offline --config config/zizmor.yml --min-severity medium --format github .github/workflows starter/.github/workflows/checks.yml

      - name: Shell scripts (shellcheck)
        run: shellcheck -S warning tools/*.sh

      - name: Python scripts compile
        run: python -m compileall -q scripts
